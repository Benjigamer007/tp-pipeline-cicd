name: Verificar proyecto

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
        
      - name: Mostrar version de Python
        run: python --version

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas y generar reporte
        run: |
          mkdir -p site
          python -m pytest -v --html=site/index.html --self-contained-html

      - name: Guardar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pruebas
          path: site/index.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Configurar GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Preparar publicacion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publicar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}

    steps:
      - name: Publicar reporte
        id: publicacion
        uses: actions/deploy-pages@v5
